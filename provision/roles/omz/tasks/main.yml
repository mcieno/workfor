---
# tasks file for roles/omz

- name: install zsh
  ansible.builtin.apt:
    name:
      - zsh
    state: latest

- name: set default shell
  ansible.builtin.user:
    name: "{{ item }}"
    shell: /usr/bin/zsh
    state: present
  loop:
    - root
    - "{{ oh_my_zsh_default_user | mandatory }}"

- name: install omz
  become_user: "{{ item }}"
  ansible.builtin.shell:
    cmd: curl -fsSL https://raw.githubusercontent.com/ohmyzsh/ohmyzsh/master/tools/install.sh | GIT_SSH_COMMAND="ssh -o StrictHostKeyChecking=no" sh
    creates: "~{{ item }}/.oh-my-zsh/oh-my-zsh.sh"
  loop:
    - root
    - "{{ oh_my_zsh_default_user | mandatory }}"

- name: personalize run commands
  ansible.builtin.lineinfile:
    path: "~{{ item.user }}/.zshrc"
    line: "{{ item.line }}"
    regexp: "{{ item.regexp }}"
  loop:
    - {
        user: "{{ oh_my_zsh_default_user | mandatory }}",
        line: "alias s='sudo'",
        regexp: "^alias s=",
      }
    - {
        user: "root",
        line: "alias myip='dig ip @dns.toys +short'",
        regexp: "^alias myip=",
      }
    - {
        user: "{{ oh_my_zsh_default_user | mandatory }}",
        line: "alias myip='dig ip @dns.toys +short'",
        regexp: "^alias myip=",
      }
    - {
        user: "root",
        line: "export EDITOR=nano",
        regexp: "^export EDITOR=",
      }
    - {
        user: "{{ oh_my_zsh_default_user | mandatory }}",
        line: "export EDITOR=nano",
        regexp: "^export EDITOR=",
      }
    - {
        user: "root",
        line: "plugins=(git docker)",
        regexp: "^plugins=",
      }
    - {
        user: "{{ oh_my_zsh_default_user | mandatory }}",
        line: "plugins=(git docker)",
        regexp: "^plugins=",
      }
    - {
        user: "root",
        line: "ZSH_THEME=agnoster",
        regexp: "^ZSH_THEME=",
      }
    - {
        user: "{{ oh_my_zsh_default_user | mandatory }}",
        line: "ZSH_THEME=agnoster",
        regexp: "^ZSH_THEME=",
      }
