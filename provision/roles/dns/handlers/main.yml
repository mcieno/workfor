---
# handlers file for roles/dns

- name: Restart dnsmasq
  ansible.builtin.systemd_service:
    name: dnsmasq
    enabled: true
    state: restarted
    daemon_reload: true

- name: Restart systemd-resolved
  ansible.builtin.systemd_service:
    name: systemd-resolved
    masked: false
    enabled: true
    state: restarted
    daemon_reload: true
