---
# tasks file for roles/utils

- name: install utils
  ansible.builtin.apt:
    name:
      - binutils
      - build-essential
      - bash
      - curl
      - gcc
      - gdb
      - hexedit
      - htop
      - jq
      - ltrace
      - make
      - nano
      - net-tools
      - nload
      - nmap
      - openssl
      - strace
      - tar
      - unzip
      - wget
      - xxd
      - zip
      - zsh
    state: latest

- name: install aws cli
  block:
    - name: install
      ansible.builtin.shell:
        creates: /usr/local/bin/aws
        executable: /usr/bin/bash
        cmd: |
          set -euo pipefail
          curl -fsSL https://awscli.amazonaws.com/v2/install.sh | bash -s -- --system

    - name: configure aws cli
      ansible.builtin.file:
        path: "~{{ awscli_default_user | mandatory }}/.aws"
        owner: "{{ awscli_default_user | mandatory }}"
        group: "{{ awscli_default_user | mandatory }}"
        state: directory
        mode: "0700"
    - name: configure aws cli
      ansible.builtin.template:
        src: .aws.j2
        dest: "~{{ awscli_default_user | mandatory }}/.aws/config"
        owner: "{{ awscli_default_user | mandatory }}"
        group: "{{ awscli_default_user | mandatory }}"
        mode: "0600"
        force: false

- name: install terraform
  block:
    - name: download installer (arm64)
      when: ansible_facts["architecture"] == "aarch64"
      ansible.builtin.unarchive:
        src: https://releases.hashicorp.com/terraform/1.17.2/terraform_1.17.2_linux_arm64.zip
        dest: /tmp
        remote_src: true
        creates: /usr/local/bin/terraform
    - name: download installer (amd64)
      when: ansible_facts["architecture"] != "aarch64"
      ansible.builtin.unarchive:
        src: https://releases.hashicorp.com/terraform/1.17.2/terraform_1.17.2_linux_amd64.zip
        dest: /tmp
        remote_src: true
        creates: /usr/local/bin/terraform

    - name: install
      ansible.builtin.shell:
        cmd: install ./terraform /usr/local/bin
        chdir: /tmp
        creates: /usr/local/bin/terraform
    - name: remove installation files
      ansible.builtin.file:
        path: /tmp/terraform
        state: absent

- name: install golang
  block:
    - name: install golang (arm64)
      when: ansible_facts["architecture"] == "aarch64"
      ansible.builtin.unarchive:
        src: "https://go.dev/dl/go1.27.4.linux-arm64.tar.gz"
        dest: /usr/local
        remote_src: true
        creates: /usr/local/go/bin/go
    - name: install golang (amd64)
      when: ansible_facts["architecture"] != "aarch64"
      ansible.builtin.unarchive:
        src: "https://go.dev/dl/go1.27.4.linux-amd64.tar.gz"
        dest: /usr/local
        remote_src: true
        creates: /usr/local/go/bin/go

    - name: add to path
      ansible.builtin.lineinfile:
        path: "/etc/zsh/zshenv"
        line: 'export PATH="/usr/local/go/bin:$PATH"'
        create: true
        owner: root
        group: root
        mode: "0644"
