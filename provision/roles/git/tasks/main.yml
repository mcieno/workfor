---
# tasks file for roles/git

- name: install git
  ansible.builtin.apt:
    name:
      - git
      - git-lfs
    state: latest

- name: ensure git config folder exists
  ansible.builtin.file:
    path: "~{{ git_default_user | mandatory }}/.config/git"
    state: directory
    owner: "{{ git_default_user | mandatory }}"
    group: "{{ git_default_user | mandatory }}"
    recurse: true

- name: create global gitignore-file
  ansible.builtin.template:
    src: ignore.j2
    dest: "~{{ git_default_user | mandatory }}/.config/git/ignore"
    owner: "{{ git_default_user | mandatory }}"
    group: "{{ git_default_user | mandatory }}"

- name: create global gitconfig-file
  ansible.builtin.template:
    src: config.j2
    dest: "~{{ git_default_user | mandatory }}/.config/git/config"
    owner: "{{ git_default_user | mandatory }}"
    group: "{{ git_default_user | mandatory }}"

